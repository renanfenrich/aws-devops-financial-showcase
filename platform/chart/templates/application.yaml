apiVersion: v1
kind: ServiceAccount
metadata:
  name: showcase-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-api
  annotations:
    showcase/source-revision: {{ .Values.sourceRevision | quote }}
spec:
  replicas: {{ .Values.api.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: showcase-api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: showcase-api
        access: database
      annotations:
        showcase/source-revision: {{ .Values.sourceRevision | quote }}
    spec:
      serviceAccountName: showcase-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: showcase-secrets
                  key: DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: showcase-secrets
                  key: API_TOKEN
            - name: OTEL_SERVICE_NAME
              value: financial-showcase-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-api
spec:
  selector:
    app: showcase-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: showcase-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: showcase-api
---
apiVersion: v1
kind: Service
metadata:
  name: showcase-metrics
spec:
  clusterIP: None
  selector:
    app: showcase-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: showcase-migrate-{{ .Values.sourceRevision | sha256sum | trunc 8 }}
  labels:
    app: showcase-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: showcase-migrate
        access: database
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          command: [python, -m, showcase.migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: showcase-secrets
                  key: DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: showcase-secrets
                  key: API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
