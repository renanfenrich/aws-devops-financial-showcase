apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/showcase/alerts.yml
    scrape_configs:
      - job_name: showcase-api
        dns_sd_configs:
          - names: [showcase-metrics.{{ .Release.Namespace }}.svc.cluster.local]
            type: A
            port: 8080
            refresh_interval: 5s
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector:8889]
  alerts.yml: |
{{ .Files.Get "config/alerts.yml" | indent 4 }}
  collector.yml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      batch:
        timeout: 1s
        send_batch_size: 256
    exporters:
      otlp_grpc/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
  tempo.yml: |
    target: all
    server:
      http_listen_port: 3200
      log_level: warn
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    live_store:
      max_trace_idle: 10s
      max_block_duration: 5m
      max_block_bytes: 1000000
    backend_scheduler:
      provider:
        compaction:
          compaction:
            block_retention: 1h
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: showcase
        orgId: 1
        folder: Showcase
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/showcase/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: showcase-dashboards
data:
  operations.json: |
{{ .Files.Get "dashboards/operations.json" | indent 4 }}
