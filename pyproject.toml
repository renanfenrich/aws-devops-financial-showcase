[project]
name = "aws-devops-financial-showcase"
version = "0.1.0"
description = "Local-only synthetic financial operations reliability showcase"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "prometheus-client==0.26.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx2==2.16.0", "ruff==0.17.3", "pytest-cov==7.1.0", "PyYAML==6.0.3"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showcase"]

[tool.pytest.ini_options]
testpaths = ["tests/app"]
addopts = "-ra"
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable local PostgreSQL"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["showcase"]
