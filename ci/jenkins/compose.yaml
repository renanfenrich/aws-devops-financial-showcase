name: financial-showcase-jenkins
services:
  controller:
    image: financial-showcase-jenkins-controller:local
    environment:
      SHOWCASE_JENKINS_PASSWORD: ${SHOWCASE_JENKINS_PASSWORD:?}
    ports: ['127.0.0.1:18091:8080']
    volumes:
      - ../../.local/jenkins/snapshot:/snapshot:ro
      - controller:/var/jenkins_home
    mem_limit: 1200m
    cpus: 1.0
  agent:
    image: financial-showcase-jenkins-agent:local
    environment:
      JENKINS_URL: http://controller:8080
      JENKINS_AGENT_NAME: showcase-agent
      JENKINS_SECRET: ${JENKINS_SECRET:-not-started}
      JENKINS_WEB_SOCKET: 'true'
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?}
      API_TOKEN: ${API_TOKEN:?}
    volumes:
      - ../../.local/jenkins/snapshot:/snapshot:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2500m
    cpus: 2.0
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ../../migrations/init-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
volumes:
  controller:
