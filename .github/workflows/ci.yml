name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Local contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned toolchain
        run: make bootstrap
      - name: Application, infrastructure and chart gates
        run: make evidence
      - name: Container and supply-chain checks
        run: make image security
      - name: Disabled state graph with networking blocked
        run: make evidence GATE=state-plan
      - name: Atlantis local smoke
        run: make atlantis-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'(feat|fix|docs|chore|test|refactor|ci|build|perf|revert)(\([a-z0-9-]+\))?!?: .+', os.environ['PR_TITLE']), 'Use a Conventional Commit PR title'
          PY
